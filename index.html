<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Word games for early readers: flashcards for the tricky words children learn in Reception, Year 1 and Year 2, and a picture match memory game. No accounts, no adverts, no tracking.">
<meta name="theme-color" content="#FFF8E7">
<title>Tricky Words</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/Andika-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Andika-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="trickywords.css">
</head>
<body>

<main id="view-menu" class="view">
  <header class="menu-header">
    <h1 class="hello">Tricky Words</h1>
  </header>
  <div id="game-tiles" class="tiles"></div>
  <button id="btn-info" class="flash-info-btn menu-info-btn" type="button" aria-label="How to play and about" aria-expanded="false" aria-controls="menu-info">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 10.5v6.5"/><circle class="fill" cx="12" cy="7.2" r="1.4"/></svg>
  </button>
  <button id="btn-cog" class="cog" type="button" aria-label="Grown-ups: press and hold">
    <svg class="cog-ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="ring-track" cx="32" cy="32" r="29"/>
      <circle class="ring-fill" cx="32" cy="32" r="29" pathLength="100"/>
    </svg>
    <svg class="cog-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
  <footer class="menu-footer">
    <a href="LICENSE.txt">MIT licence</a> · <button id="footer-credits" class="footer-link" type="button">Credits</button>
  </footer>
  <noscript><p class="noscript">Tricky Words needs JavaScript to show the games.</p></noscript>
</main>

<div id="view-game" class="view hidden">
  <button id="btn-home" class="home-btn" type="button" aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg>
  </button>
  <div id="game-root" class="game-root"></div>
</div>

<div id="corner" class="corner hidden" role="dialog" aria-modal="true" aria-labelledby="corner-title">
  <div class="corner-panel">
    <h2 id="corner-title">Grown-ups</h2>
    <button id="set-sound" class="btn btn-toggle" type="button" aria-pressed="true">Sound <span class="state"></span></button>
    <button id="set-timer" class="btn btn-toggle" type="button" aria-pressed="true">Timer <span class="state"></span></button>
    <button id="corner-close" class="btn btn-primary" type="button">Done</button>
  </div>
</div>

<script type="module" src="shell.js"></script>
</body>
</html>
